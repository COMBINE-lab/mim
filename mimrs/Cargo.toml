[package]
name = "mimrs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
flate2 = "1.0"
libc = { version = "0.2.177", features = ["use_std"] }
libz-ng-sys = "1.1.23"
needletail = "0.6.3"
serde_cbor = "0.11"

[profile.release-with-debug]
inherits = "release"
debug = true
